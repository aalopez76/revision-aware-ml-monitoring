name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same virtual environment as local development, from the same
      # lockfile. --locked fails when uv.lock and pyproject.toml have drifted
      # apart, so CI cannot quietly resolve a different set of versions than
      # the one the reported figures were produced under.
      - name: Install uv
        run: python -m pip install uv==0.11.19

      - name: Install
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      # Asks a different question from the test suite: pytest asks whether the
      # software works, this asks whether the published claims still match the
      # files that back them. It reads only versioned JSON, so it needs no
      # network and no recomputation.
      - name: Verify reported results
        run: uv run python scripts/verify_results.py
