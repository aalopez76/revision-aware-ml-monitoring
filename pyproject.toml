[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revmon"
version = "0.1.0"
description = "Revision-aware monitoring: telling data revision from concept drift in a live forecasting season"
requires-python = ">=3.11"
dependencies = [
    # Cliente oficial de Delphi para la API V5. Se usa en lugar de reimplementar
    # el protocolo: los metodos V3/V4 se deprecan desde octubre de 2026, y el
    # riesgo de transporte (auth, paginacion, nombres de parametros) deja de ser
    # nuestro. El contrato de datos sigue habiendo que medirlo en G0.
    "epidatpy",
    # Historia de git del hub de FluSight: segunda reconstruccion de vintages.
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    # Entra en P2, con consumidor: M1 es un Ridge dentro de un Pipeline, y el
    # Pipeline es justamente lo que impide que el escalado se ajuste con datos
    # fuera del training de cada origen. La fuga TEMPORAL no la resuelve
    # scikit-learn: la resuelve el contrato as-of de panel.load_as_of.
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    # El invariante temporal es universal, no ejemplar: se prueba generando
    # historiales aleatorios de publicaciones y revisiones, no tres casos.
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
